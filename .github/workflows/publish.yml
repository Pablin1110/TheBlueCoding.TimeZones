name: Publish NuGet package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore TheBlueCoding.TimeZones.sln

      - name: Test
        run: dotnet test TheBlueCoding.TimeZones.sln --configuration Release --no-restore

      - name: Pack
        run: dotnet pack src/TheBlueCoding.TimeZones/TheBlueCoding.TimeZones.csproj --configuration Release --no-restore --output artifacts

      - name: Login to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: PabloSantacruz

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source "https://api.nuget.org/v3/index.json" --skip-duplicate
